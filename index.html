<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iNote</title>
  </head>
  <body>
    <!-- 커스텀 타이틀바 — 좌: 사이드바/네비, 중: 드래그, 우: 창 제어 -->
    <div id="titlebar">
      <div class="tb-left">
        <button id="sb-toggle" type="button" title="사이드바 열기/닫기">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button id="nav-back" type="button" title="뒤로 (Alt+←)" disabled>‹</button>
        <button id="nav-fwd" type="button" title="앞으로 (Alt+→)" disabled>›</button>
      </div>
      <div class="tb-drag" data-tauri-drag-region></div>
      <div class="tb-right">
        <button id="win-min" type="button" title="최소화"><svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1"/></svg></button>
        <button id="win-max" type="button" title="최대화/복원"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
        <button id="win-close" type="button" title="닫기"><svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.1"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.1"/></svg></button>
      </div>
    </div>
    <div id="app">
      <!-- 좌측: 페이지 트리 -->
      <aside id="sidebar">
        <div id="sb-head">
          <span class="sb-brand">iNote</span>
        </div>
        <button id="sb-search" type="button">🔍 검색 <span class="kbd-hint">Ctrl+K</span></button>
        <div id="sb-tree"></div>
        <button id="sb-new" type="button">＋ 새 페이지</button>
      </aside>
      <!-- 우측: 에디터 -->
      <main id="editor-pane">
        <div id="doc-cover" class="hidden"><button id="cover-change" type="button">커버 변경</button></div>
        <div id="doc">
          <div id="add-row">
            <button id="icon-add" type="button" class="hidden">😀 아이콘 추가</button>
            <button id="cover-add" type="button">🖼 커버 추가</button>
          </div>
          <div id="title-row">
            <button id="doc-icon" type="button" title="아이콘 바꾸기">📄</button>
            <input id="doc-title" type="text" placeholder="제목 없음" spellcheck="false" autocomplete="off" />
          </div>
          <div id="prop-row">
            <span class="prop-label">🗓 날짜</span>
            <input id="doc-date" type="date" />
            <button id="date-clear" type="button" class="hidden" title="날짜 지우기">✕</button>
          </div>
          <div id="blocks"></div>
        </div>
        <div id="empty-state" class="hidden">
          <p>페이지를 선택하거나 새로 만들어 보세요</p>
        </div>
      </main>
    </div>

    <!-- "/" 블록 메뉴 -->
    <div id="slash-menu" class="hidden"></div>

    <!-- 이모지 선택 -->
    <div id="emoji-pop" class="hidden"></div>

    <!-- 검색 (Ctrl+K) -->
    <div id="search-overlay" class="hidden">
      <div id="search-box">
        <input id="search-input" type="text" placeholder="페이지 검색…" spellcheck="false" autocomplete="off" />
        <div id="search-results"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
